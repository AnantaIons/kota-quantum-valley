<svg viewBox="0 0 440 400" role="img" aria-label="In user-mode emulation, qemu-aarch64 translates the ARM program&#x27;s instructions into x86 instructions for the laptop processor, and passes its system calls to the laptop&#x27;s Linux kernel. In system emulation, used from Part 7, QEMU imitates a whole ARM computer with its own kernel." xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip-p0-qemu"><rect x="0" y="0" width="440" height="400"/></clipPath></defs><rect class="f2 c2" x="14" y="14" width="412" height="50" rx="9"/><text class="lab t2" x="220" y="36" text-anchor="middle">where-arm</text><text class="lab small t5" x="220" y="51" text-anchor="middle">ARM64 instructions: add, ldr, svc ...</text><line class="c2" x1="220" y1="64" x2="220" y2="79"/><polygon class="head c2" points="220,86 216.5,79 223.5,79"/><text class="lab small t5" x="228" y="79" text-anchor="start">every block of instructions</text><rect class="f1 c1" x="14" y="88" width="412" height="64" rx="9"/><text class="lab t1" x="220" y="109.5" text-anchor="middle">qemu-aarch64 (a normal x86 program)</text><text class="lab small t5" x="220" y="124.5" text-anchor="middle">translates each ARM block into x86 instructions</text><text class="lab small t5" x="220" y="139.5" text-anchor="middle">and keeps the translation for next time</text><line class="c3" x1="150" y1="152" x2="150" y2="189"/><polygon class="head c3" points="150,196 146.5,189 153.5,189"/><text class="lab small t5" x="158" y="178" text-anchor="start">x86 instructions</text><line class="c1" x1="290" y1="152" x2="290" y2="189"/><polygon class="head c1" points="290,196 286.5,189 293.5,189"/><text class="lab small t5" x="298" y="178" text-anchor="start">system calls</text><rect class="f3 c3" x="14" y="198" width="200" height="60" rx="9"/><text class="lab t3" x="114" y="225" text-anchor="middle">the laptop processor</text><text class="lab small t5" x="114" y="240" text-anchor="middle">runs the translation</text><rect class="f3 c3" x="226" y="198" width="200" height="60" rx="9"/><text class="lab t3" x="326" y="225" text-anchor="middle">the laptop Linux kernel</text><text class="lab small t5" x="326" y="240" text-anchor="middle">answers uname, write ...</text><text class="lab small t5" x="220" y="290" text-anchor="middle">user-mode emulation: one program, the host kernel</text><rect class="f2 c5" x="14" y="304" width="412" height="74" rx="9"/><text class="lab" x="220" y="330.5" text-anchor="middle">Part 7: system emulation (qemu-system-aarch64)</text><text class="lab small t5" x="220" y="345.5" text-anchor="middle">a whole ARM computer: processor, memory, devices,</text><text class="lab small t5" x="220" y="360.5" text-anchor="middle">and its own ARM Linux kernel</text></svg>
