<svg viewBox="0 0 440 452" role="img" aria-label="The layers of a Linux system. Processes and the C library run in user mode. A system call instruction crosses into kernel mode, where the scheduler, the memory manager, the file systems and the device drivers run, directly above the hardware. Interrupts also enter the kernel." xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip-p1-layers"><rect x="0" y="0" width="440" height="452"/></clipPath></defs><text class="lab small t1" x="14" y="16" text-anchor="start">user mode: EL0 on ARM64, ring 3 on x86</text><rect class="f1 c1" x="14" y="26" width="132" height="44" rx="9"/><text class="lab t1" x="80" y="45" text-anchor="middle">your program</text><text class="lab small t5" x="80" y="60" text-anchor="middle">process</text><rect class="f1 c1" x="154" y="26" width="132" height="44" rx="9"/><text class="lab t1" x="220" y="45" text-anchor="middle">a shell</text><text class="lab small t5" x="220" y="60" text-anchor="middle">process</text><rect class="f1 c1" x="294" y="26" width="132" height="44" rx="9"/><text class="lab t1" x="360" y="45" text-anchor="middle">a web server</text><text class="lab small t5" x="360" y="60" text-anchor="middle">process</text><rect class="f3 c1" x="14" y="84" width="412" height="40" rx="9"/><text class="lab t1" x="220" y="108.5" text-anchor="middle">C library: printf, malloc, fopen ...</text><line class="c2 dash" x1="14" y1="146" x2="426" y2="146"/><text class="lab small t2" x="14" y="140" text-anchor="start">system call: syscall on x86-64, svc on ARM64</text><line class="c2" x1="380" y1="124" x2="380" y2="159"/><polygon class="head c2" points="380,166 376.5,159 383.5,159"/><text class="lab small t3" x="14" y="182" text-anchor="start">kernel mode: EL1 on ARM64, ring 0 on x86</text><rect class="f3 c3" x="14" y="192" width="202" height="52" rx="9"/><text class="lab t3" x="115" y="215" text-anchor="middle">scheduler</text><text class="lab small t5" x="115" y="230" text-anchor="middle">shares the processors</text><rect class="f3 c3" x="224" y="192" width="202" height="52" rx="9"/><text class="lab t3" x="325" y="215" text-anchor="middle">memory manager</text><text class="lab small t5" x="325" y="230" text-anchor="middle">one map per process</text><rect class="f3 c3" x="14" y="252" width="202" height="52" rx="9"/><text class="lab t3" x="115" y="275" text-anchor="middle">file systems, network</text><text class="lab small t5" x="115" y="290" text-anchor="middle">one interface: read, write</text><rect class="f3 c3" x="224" y="252" width="202" height="52" rx="9"/><text class="lab t3" x="325" y="275" text-anchor="middle">device drivers</text><text class="lab small t5" x="325" y="290" text-anchor="middle">talk to the registers</text><line class="c5" x1="220" y1="304" x2="220" y2="323"/><polygon class="head c5" points="220,330 216.5,323 223.5,323"/><rect class="f2 c5" x="14" y="332" width="412" height="52" rx="9"/><text class="lab" x="220" y="355" text-anchor="middle">hardware</text><text class="lab small t5" x="220" y="370" text-anchor="middle">processor, MMU, timer, memory, storage, devices</text><text class="lab small t5" x="220" y="410" text-anchor="middle">interrupts (timer, devices) also enter the kernel,</text><text class="lab small t5" x="220" y="426" text-anchor="middle">which is how the scheduler takes the processor back</text></svg>
