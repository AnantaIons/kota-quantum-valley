<svg viewBox="0 0 440 300" role="img" aria-label="C programs are machine code that runs on the processor directly. Python programs are bytecode run by the CPython interpreter, which is itself a compiled C program. Both reach the hardware only through the operating system kernel, using system calls." xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip-p0-stack"><rect x="0" y="0" width="440" height="300"/></clipPath></defs><text class="lab t3" x="110" y="18" text-anchor="middle">C</text><text class="lab t1" x="330" y="18" text-anchor="middle">Python</text><rect class="f3 c3" x="20" y="30" width="180" height="120" rx="9"/><text class="lab t3" x="110" y="72" text-anchor="middle">your C program</text><text class="lab small t5" x="110" y="87" text-anchor="middle">machine code: the</text><text class="lab small t5" x="110" y="102" text-anchor="middle">processor&#x27;s own</text><text class="lab small t5" x="110" y="117" text-anchor="middle">instructions</text><rect class="f3 c1" x="240" y="30" width="180" height="52" rx="9"/><text class="lab t1" x="330" y="53" text-anchor="middle">your Python program</text><text class="lab small t5" x="330" y="68" text-anchor="middle">bytecode</text><line class="c1" x1="330" y1="82" x2="330" y2="89"/><polygon class="head c1" points="330,96 326.5,89 333.5,89"/><rect class="f3 c3" x="240" y="98" width="180" height="52" rx="9"/><text class="lab t3" x="330" y="121" text-anchor="middle">CPython interpreter</text><text class="lab small t5" x="330" y="136" text-anchor="middle">a C program, compiled</text><line class="c5" x1="110" y1="150" x2="110" y2="171"/><polygon class="head c5" points="110,178 106.5,171 113.5,171"/><text class="lab small t5" x="116" y="168" text-anchor="start">system calls</text><line class="c5" x1="330" y1="150" x2="330" y2="171"/><polygon class="head c5" points="330,178 326.5,171 333.5,171"/><text class="lab small t5" x="336" y="168" text-anchor="start">system calls</text><rect class="f3 c2" x="20" y="180" width="400" height="46" rx="9"/><text class="lab t2" x="220" y="200" text-anchor="middle">operating system kernel</text><text class="lab small t5" x="220" y="215" text-anchor="middle">Linux, Windows, macOS, Android</text><line class="c5" x1="220" y1="226" x2="220" y2="237"/><polygon class="head c5" points="220,244 216.5,237 223.5,237"/><rect class="f2 c5" x="20" y="246" width="400" height="46" rx="9"/><text class="lab" x="220" y="266" text-anchor="middle">hardware</text><text class="lab small t5" x="220" y="281" text-anchor="middle">processor, memory, screen, disk</text></svg>
