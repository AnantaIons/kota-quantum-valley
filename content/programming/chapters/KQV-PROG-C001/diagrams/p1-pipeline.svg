<svg viewBox="0 0 440 520" role="img" aria-label="C is translated before it runs, in four stages: preprocessor, compiler, assembler and linker, giving a program of machine code. Python compiles the whole file to bytecode each time it runs, then the CPython interpreter loop carries out each instruction. Both end in the same write system call to the kernel." xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip-p1-pipeline"><rect x="0" y="0" width="440" height="520"/></clipPath></defs><text class="lab small t3" x="111" y="16" text-anchor="middle">C: before running, once</text><text class="lab small t1" x="329" y="16" text-anchor="middle">Python: every time you run</text><rect class="f3 c5" x="14" y="28" width="194" height="44" rx="9"/><text class="lab" x="111" y="47" text-anchor="middle">hello.c</text><text class="lab small t5" x="111" y="62" text-anchor="middle">your text</text><line class="c3" x1="111" y1="72" x2="111" y2="79"/><polygon class="head c3" points="111,86 107.5,79 114.5,79"/><rect class="f3 c3" x="14" y="86" width="194" height="44" rx="9"/><text class="lab t3" x="111" y="105" text-anchor="middle">preprocessor</text><text class="lab small t5" x="111" y="120" text-anchor="middle">gcc -E: pastes #include</text><line class="c3" x1="111" y1="130" x2="111" y2="137"/><polygon class="head c3" points="111,144 107.5,137 114.5,137"/><rect class="f3 c3" x="14" y="144" width="194" height="44" rx="9"/><text class="lab t3" x="111" y="163" text-anchor="middle">compiler</text><text class="lab small t5" x="111" y="178" text-anchor="middle">gcc -S: C to assembly</text><line class="c3" x1="111" y1="188" x2="111" y2="195"/><polygon class="head c3" points="111,202 107.5,195 114.5,195"/><rect class="f3 c3" x="14" y="202" width="194" height="44" rx="9"/><text class="lab t3" x="111" y="221" text-anchor="middle">assembler</text><text class="lab small t5" x="111" y="236" text-anchor="middle">gcc -c: machine code (.o)</text><line class="c3" x1="111" y1="246" x2="111" y2="253"/><polygon class="head c3" points="111,260 107.5,253 114.5,253"/><rect class="f3 c3" x="14" y="260" width="194" height="44" rx="9"/><text class="lab t3" x="111" y="279" text-anchor="middle">linker</text><text class="lab small t5" x="111" y="294" text-anchor="middle">joins hello.o and libc</text><line class="c3" x1="111" y1="304" x2="111" y2="311"/><polygon class="head c3" points="111,318 107.5,311 114.5,311"/><rect class="f1 c3" x="14" y="318" width="194" height="44" rx="9"/><text class="lab t3" x="111" y="337" text-anchor="middle">hello</text><text class="lab small t5" x="111" y="352" text-anchor="middle">a program of machine code</text><rect class="f3 c5" x="232" y="28" width="194" height="44" rx="9"/><text class="lab" x="329" y="47" text-anchor="middle">hello.py</text><text class="lab small t5" x="329" y="62" text-anchor="middle">your text</text><line class="c1" x1="329" y1="72" x2="329" y2="79"/><polygon class="head c1" points="329,86 325.5,79 332.5,79"/><rect class="f3 c1" x="232" y="86" width="194" height="44" rx="9"/><text class="lab t1" x="329" y="105" text-anchor="middle">bytecode compiler</text><text class="lab small t5" x="329" y="120" text-anchor="middle">whole file, first</text><line class="c1" x1="329" y1="130" x2="329" y2="137"/><polygon class="head c1" points="329,144 325.5,137 332.5,137"/><rect class="f3 c1" x="232" y="144" width="194" height="44" rx="9"/><text class="lab t1" x="329" y="163" text-anchor="middle">bytecode</text><text class="lab small t5" x="329" y="178" text-anchor="middle">LOAD_NAME, CALL, ...</text><line class="c1" x1="329" y1="188" x2="329" y2="195"/><polygon class="head c1" points="329,202 325.5,195 332.5,195"/><rect class="f1 c1" x="232" y="202" width="194" height="44" rx="9"/><text class="lab t1" x="329" y="221" text-anchor="middle">interpreter loop</text><text class="lab small t5" x="329" y="236" text-anchor="middle">CPython, written in C</text><line class="c3" x1="111" y1="362" x2="111" y2="383"/><polygon class="head c3" points="111,390 107.5,383 114.5,383"/><text class="lab small t5" x="117" y="380" text-anchor="start">processor runs it</text><line class="c1" x1="329" y1="246" x2="329" y2="383"/><polygon class="head c1" points="329,390 325.5,383 332.5,383"/><text class="lab small t5" x="335" y="322" text-anchor="start">runs each instruction</text><rect class="f3 c2" x="14" y="392" width="412" height="52" rx="9"/><text class="lab t2" x="220" y="415" text-anchor="middle">write(1, &quot;Hello, Kota!\n&quot;, 13)</text><text class="lab small t5" x="220" y="430" text-anchor="middle">the same system call from both programs</text><line class="c5" x1="220" y1="444" x2="220" y2="457"/><polygon class="head c5" points="220,464 216.5,457 223.5,457"/><rect class="f2 c5" x="14" y="466" width="412" height="40" rx="9"/><text class="lab" x="220" y="490.5" text-anchor="middle">kernel puts 13 bytes on your screen</text></svg>
