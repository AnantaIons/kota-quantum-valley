<svg viewBox="0 0 440 300" role="img" aria-label="Encoding the rupee sign, U+20B9, in UTF-8. Its 16 bits 0010 0000 1011 1001 are split into groups of 4, 6 and 6 bits. Each group is placed after a fixed prefix: 1110 for the first byte of a three-byte character, 10 for each continuation byte. The bytes are e2, 82 and b9." xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip-p2-utf8"><rect x="0" y="0" width="440" height="300"/></clipPath></defs><text class="lab t5" x="220" y="22" text-anchor="middle">₹ is code point U+20B9</text><text class="lab t1" x="96" y="68" text-anchor="middle" font-weight="600" style="font-family: var(--font-mono)">0010</text><text class="lab t2" x="200" y="68" text-anchor="middle" font-weight="600" style="font-family: var(--font-mono)">000010</text><text class="lab t3" x="318" y="68" text-anchor="middle" font-weight="600" style="font-family: var(--font-mono)">111001</text><text class="lab small t5" x="220" y="92" text-anchor="middle">its 16 bits, split 4 + 6 + 6</text><line class="c1" x1="96" y1="100" x2="85.63" y2="143.19"/><polygon class="head c1" points="84,150 82.23,142.38 89.04,144.01"/><rect class="f3 c5" x="24" y="156" width="120" height="44" rx="9"/><text class="lab" x="84" y="183" text-anchor="middle" style="font-family: var(--font-mono)"><tspan class="t5">1110</tspan><tspan class="t1" font-weight="600">0010</tspan></text><line class="c2" x1="200" y1="100" x2="217.4" y2="143.5"/><polygon class="head c2" points="220,150 214.15,144.8 220.65,142.2"/><rect class="f3 c5" x="160" y="156" width="120" height="44" rx="9"/><text class="lab" x="220" y="183" text-anchor="middle" style="font-family: var(--font-mono)"><tspan class="t5">10</tspan><tspan class="t2" font-weight="600">000010</tspan></text><line class="c3" x1="318" y1="100" x2="351.76" y2="144.43"/><polygon class="head c3" points="356,150 348.98,146.54 354.55,142.31"/><rect class="f3 c5" x="296" y="156" width="120" height="44" rx="9"/><text class="lab" x="356" y="183" text-anchor="middle" style="font-family: var(--font-mono)"><tspan class="t5">10</tspan><tspan class="t3" font-weight="600">111001</tspan></text><line class="c5" x1="84" y1="200" x2="84" y2="219"/><polygon class="head c5" points="84,226 80.5,219 87.5,219"/><text class="lab big t5" x="84" y="254" text-anchor="middle" style="font-family: var(--font-mono)">e2</text><line class="c5" x1="220" y1="200" x2="220" y2="219"/><polygon class="head c5" points="220,226 216.5,219 223.5,219"/><text class="lab big t5" x="220" y="254" text-anchor="middle" style="font-family: var(--font-mono)">82</text><line class="c5" x1="356" y1="200" x2="356" y2="219"/><polygon class="head c5" points="356,226 352.5,219 359.5,219"/><text class="lab big t5" x="356" y="254" text-anchor="middle" style="font-family: var(--font-mono)">b9</text><text class="lab small t5" x="220" y="290" text-anchor="middle">grey bits are fixed: 1110 starts a 3-byte character, 10 marks a continuation</text></svg>
