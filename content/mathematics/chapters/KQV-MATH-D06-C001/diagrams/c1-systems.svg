<svg viewBox="0 0 440 300" role="img" aria-label="Nested number systems N inside Z inside Q inside R inside C, each labelled with an equation that forced the next one." xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip-c1-systems"><rect x="0" y="0" width="440" height="300"/></clipPath></defs><rect class="f2 c2" x="10" y="10" width="420" height="280" rx="14"/><text class="lab big t2" x="24" y="36" text-anchor="start">ℂ</text><text class="lab small" x="418" y="34" text-anchor="end">x² = −1:  ±i</text><rect class="f3 c3" x="40" y="44" width="360" height="226" rx="14"/><text class="lab big t3" x="54" y="70" text-anchor="start">ℝ</text><text class="lab small" x="388" y="68" text-anchor="end">x² = 2:  ±√2</text><rect class="f3 c4" x="70" y="78" width="300" height="172" rx="14"/><text class="lab big t4" x="84" y="104" text-anchor="start">ℚ</text><text class="lab small" x="358" y="102" text-anchor="end">3x = 2:  2/3</text><rect class="f1 c1" x="100" y="112" width="240" height="118" rx="14"/><text class="lab big t1" x="114" y="138" text-anchor="start">ℤ</text><text class="lab small" x="328" y="136" text-anchor="end">x + 5 = 2:  −3</text><rect class="f1 c1" x="130" y="146" width="180" height="64" rx="14"/><text class="lab big t1" x="144" y="172" text-anchor="start">ℕ</text><text class="lab small" x="298" y="170" text-anchor="end">0, 1, 2, 3, …</text></svg>
