<svg viewBox="0 0 440 343" role="img" aria-label="The plane of ordered pairs. The horizontal axis holds the pairs (a, 0), a copy of the real numbers. The pair i = (0, 1) squares to (−1, 0), and (3, 2) is (3, 0) plus (2, 0) times (0, 1)." xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip-c4-pairs"><rect x="34" y="14" width="392" height="301"/></clipPath></defs><line class="grid" x1="73.2" y1="315" x2="73.2" y2="14"/><line class="grid" x1="203.87" y1="315" x2="203.87" y2="14"/><line class="grid" x1="269.2" y1="315" x2="269.2" y2="14"/><line class="grid" x1="334.53" y1="315" x2="334.53" y2="14"/><line class="grid" x1="399.87" y1="315" x2="399.87" y2="14"/><line class="grid" x1="34" y1="269.2" x2="426" y2="269.2"/><line class="grid" x1="34" y1="138.33" x2="426" y2="138.33"/><line class="grid" x1="34" y1="72.89" x2="426" y2="72.89"/><line class="ax" x1="34" y1="203.76" x2="419" y2="203.76"/><polygon class="head ax" points="426,203.76 419,207.26 419,200.26"/><line class="ax" x1="138.53" y1="315" x2="138.53" y2="21"/><polygon class="head ax" points="138.53,14 142.03,21 135.03,21"/><line class="ax" x1="203.87" y1="200.76" x2="203.87" y2="206.76"/><text class="tick" x="203.87" y="218.76" text-anchor="middle">1</text><line class="ax" x1="269.2" y1="200.76" x2="269.2" y2="206.76"/><text class="tick" x="269.2" y="218.76" text-anchor="middle">2</text><line class="ax" x1="334.53" y1="200.76" x2="334.53" y2="206.76"/><text class="tick" x="334.53" y="218.76" text-anchor="middle">3</text><line class="c1" x1="34" y1="203.76" x2="416.2" y2="203.76"/><text class="lab small t1" x="38" y="193.76" text-anchor="start">ℝ: the pairs (a, 0)</text><line class="c3" x1="138.53" y1="203.76" x2="325.53" y2="203.76"/><polygon class="head c3" points="334.53,203.76 325.53,208.26 325.53,199.26"/><line class="c2" x1="334.53" y1="203.76" x2="334.53" y2="81.89"/><polygon class="head c2" points="334.53,72.89 339.03,81.89 330.03,81.89"/><line class="c1 dash" x1="138.53" y1="203.76" x2="327.05" y2="77.89"/><polygon class="head c1" points="334.53,72.89 329.55,81.63 324.55,74.15"/><circle class="p1" cx="334.53" cy="72.89" r="5"/><circle class="p2" cx="138.53" cy="138.33" r="5"/><circle class="p5" cx="138.53" cy="269.2" r="4.4"/><circle class="p1" cx="73.2" cy="203.76" r="4.4"/><text class="lab t1" x="326.53" y="62.89" text-anchor="end">(3, 2) = 3 + 2i</text><text class="lab small t3" x="236.53" y="219.76" text-anchor="middle">(3, 0)</text><text class="lab small t2" x="342.53" y="138.33" text-anchor="start">(2, 0)(0, 1) = (0, 2)</text><text class="lab t2" x="130.53" y="142.33" text-anchor="end">i = (0, 1)</text><text class="lab small" x="130.53" y="273.2" text-anchor="end">(0, −1)</text><text class="lab small t1" x="79.2" y="221.76" text-anchor="start">(−1, 0) = −1</text></svg>
