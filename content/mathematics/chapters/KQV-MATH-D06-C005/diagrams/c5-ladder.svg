<svg viewBox="0 0 440 250" role="img" aria-label="The four real number systems in which you can always divide and which have a multiplicative norm: ℝ of dimension 1, ℂ of dimension 2 (no order), ℍ of dimension 4 (not commutative) and 𝕆 of dimension 8 (not associative)." xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="clip-c5-ladder"><rect x="0" y="0" width="440" height="250"/></clipPath></defs><rect class="f3 c3" x="18" y="192" width="96" height="44" rx="10"/><text class="lab big t3" x="38" y="222" text-anchor="start">ℝ</text><text class="lab small t5" x="74" y="220" text-anchor="start">dim 1</text><text class="lab t5" x="130" y="219" text-anchor="start">ordered</text><rect class="f3 c3" x="18" y="134" width="126" height="44" rx="10"/><text class="lab big t3" x="38" y="164" text-anchor="start">ℂ</text><text class="lab small t5" x="74" y="162" text-anchor="start">dim 2</text><text class="lab t5" x="160" y="161" text-anchor="start">loses order</text><line class="c5" x1="48" y1="178" x2="48" y2="192"/><rect class="f3 c2" x="18" y="76" width="156" height="44" rx="10"/><text class="lab big t2" x="38" y="106" text-anchor="start">ℍ</text><text class="lab small t5" x="74" y="104" text-anchor="start">dim 4</text><text class="lab t5" x="190" y="103" text-anchor="start">loses commutativity</text><line class="c5" x1="48" y1="120" x2="48" y2="134"/><rect class="f3 c1" x="18" y="18" width="186" height="44" rx="10"/><text class="lab big t1" x="38" y="48" text-anchor="start">𝕆</text><text class="lab small t5" x="74" y="46" text-anchor="start">dim 8</text><text class="lab t5" x="220" y="45" text-anchor="start">loses associativity</text><line class="c5" x1="48" y1="62" x2="48" y2="76"/><text class="lab small t5" x="430" y="238" text-anchor="end">dimension 3, 5, 6, 7…: impossible</text></svg>
